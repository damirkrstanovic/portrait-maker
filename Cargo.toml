[workspace]
members = ["crates/portrait-core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
fs2 = "0.4.3"
libc = "0.2.189"
rusqlite = { version = "0.40.0", features = ["backup", "bundled-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
unicode-normalization = "0.1.25"
uuid = { version = "1.18", features = ["serde", "v4"] }
