[workspace]
members = ["crates/portrait-core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
fs2 = "0.4.3"
libc = "0.2.189"
rusqlite = { version = "0.40.0", features = ["backup", "bundled-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
unicode-normalization = "0.1.25"
uuid = { version = "1.18", features = ["serde", "v4"] }

# Keep image processing usable in `npm run desktop` without optimizing the entire
# desktop dependency graph. Debug symbols and assertions remain enabled.
[profile.dev.package.portrait-core]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2
